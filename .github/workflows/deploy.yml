name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Entorno de destino
        options:
          - QA
          - Prod
        default: QA
      run_web:
        required: false
        type: boolean
        description: Ejecutar deploy de Web (Cloudflare Pages)
        default: true
      run_api:
        required: false
        type: boolean
        description: Ejecutar deploy de API (ECR + Lambda)
        default: true
      run_maui:
        required: false
        type: boolean
        description: Ejecutar build de MAUI Android
        default: false

jobs:
  deploy-web:
    if: ${{ inputs.run_web }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-web
        with:
          environment: ${{ inputs.environment }}
          cloudflare_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    if: ${{ inputs.run_api }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-api
        with:
          environment: ${{ inputs.environment }}
          image_tag: ${{ github.run_id }}
          aws_role_arn: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION }}
          aws_ecr_registry: ${{ secrets.AWS_ECR_REGISTRY }}

  deploy-maui:
    if: ${{ inputs.run_maui }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-maui
        with:
          environment: ${{ inputs.environment }}
