name: Deploy Web
description: Construye y despliega el frontend Blazor WebAssembly a Cloudflare Pages
inputs:
  environment:
    required: true
    description: Entorno de destino (QA o Prod)
  cloudflare_token:
    required: true
    description: Cloudflare API token (permisos Account > Cloudflare Pages > Edit + User > User Details > Read)
  cloudflare_account_id:
    required: true
    description: Cloudflare Account ID
runs:
  using: composite
  steps:
    - name: Build Blazor WebAssembly (Release)
      run: dotnet publish src/BuildIt.Web/BuildIt.Web.csproj -c Release -o ./dist
      shell: bash

    # El bundle de CSS aislado de la RCL se genera con hash de contenido y el
    # SDK no reescribe la referencia en el index.html del host: se reescribe aquí.
    - name: Reescribir link del bundle CSS aislado con su hash
      run: |
        BUNDLE=$(basename "$(ls dist/wwwroot/_content/BuildIt.SharedUI/BuildIt.SharedUI.*.bundle.scp.css | head -1)")
        sed -i "s/BuildIt.SharedUI.bundle.scp.css/$BUNDLE/" dist/wwwroot/index.html
        grep -o "$BUNDLE" dist/wwwroot/index.html
      shell: bash

    # Crea el proyecto si no existe (falla si ya existe: se ignora)
    - name: Asegurar proyecto Cloudflare Pages (QA)
      if: ${{ inputs.environment == 'QA' }}
      uses: cloudflare/wrangler-action@v3
      continue-on-error: true
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages project create buildit-qa --production-branch=main

    - name: Deploy to Cloudflare Pages (QA)
      if: ${{ inputs.environment == 'QA' }}
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages deploy dist/wwwroot --project-name buildit-qa

    - name: Verificar deployment QA
      if: ${{ inputs.environment == 'QA' }}
      run: |
        sleep 5
        BASE="https://feat-arquitectura-monorepo.buildit-qa.pages.dev"
        for p in "/" "/_framework/blazor.webassembly.js" "/manifest.json"; do
          ct=$(curl -sI "$BASE$p" | grep -i "^content-type" | tr -d '\r')
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$p")
          echo "[$code] $ct <- $p"
        done
      shell: bash

    # Crea el proyecto si no existe (falla si ya existe: se ignora)
    - name: Asegurar proyecto Cloudflare Pages (Prod)
      if: ${{ inputs.environment == 'Prod' }}
      uses: cloudflare/wrangler-action@v3
      continue-on-error: true
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages project create buildit-prod --production-branch=main

    - name: Deploy to Cloudflare Pages (Prod)
      if: ${{ inputs.environment == 'Prod' }}
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages deploy dist/wwwroot --project-name buildit-prod
