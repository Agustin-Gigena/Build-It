name: Deploy Web
description: Construye y despliega el frontend Blazor WebAssembly a Cloudflare Pages
inputs:
  environment:
    required: true
    description: Entorno de destino (QA o Prod)
  cloudflare_token:
    required: true
    description: Cloudflare API token
outputs:
  project:
    description: Nombre del proyecto de Cloudflare Pages
runs:
  using: composite
  steps:
    - name: Build Blazor WebAssembly (Release)
      run: dotnet publish src/BuildIt.Web/BuildIt.Web.csproj -c Release -o ./dist/wwwroot
      shell: bash
    - name: Deploy to Cloudflare Pages (QA)
      if: ${{ inputs.environment == 'QA' }}
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        command: pages deploy dist/wwwroot --project-name buildit-qa
    - name: Deploy to Cloudflare Pages (Prod)
      if: ${{ inputs.environment == 'Prod' }}
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        command: pages deploy dist/wwwroot --project-name buildit-prod
