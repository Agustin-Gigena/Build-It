name: Deploy Web
description: Construye y despliega el frontend Blazor WebAssembly a Cloudflare Pages
inputs:
  environment:
    required: true
    description: Entorno de destino (QA o Prod)
  cloudflare_token:
    required: true
    description: Cloudflare API token (permisos Account > Cloudflare Pages > Edit + User > User Details > Read)
  cloudflare_account_id:
    required: true
    description: Cloudflare Account ID
runs:
  using: composite
  steps:
    - name: Build Blazor WebAssembly (Release)
      run: dotnet publish src/BuildIt.Web/BuildIt.Web.csproj -c Release -o ./dist
      shell: bash

    # Crea el proyecto si no existe (falla si ya existe: se ignora)
    - name: Asegurar proyecto Cloudflare Pages (QA)
      if: ${{ inputs.environment == 'QA' }}
      uses: cloudflare/wrangler-action@v3
      continue-on-error: true
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages project create buildit-qa --production-branch=main

    - name: Deploy to Cloudflare Pages (QA)
      if: ${{ inputs.environment == 'QA' }}
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages deploy dist/wwwroot --project-name buildit-qa

    - name: Verificar deployment QA
      if: ${{ inputs.environment == 'QA' }}
      env:
        CF_TOKEN: ${{ inputs.cloudflare_token }}
        CF_ACCOUNT: ${{ inputs.cloudflare_account_id }}
      run: |
        sleep 5
        BASE="https://feat-arquitectura-monorepo.buildit-qa.pages.dev"
        for p in "/" "/_framework/blazor.webassembly.js" "/manifest.json" "/_framework/NOEXISTE.js"; do
          ct=$(curl -sI "$BASE$p" | grep -i "^content-type" | tr -d '\r')
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$p")
          echo "[$code] $ct <- $p"
        done
        echo "=== API: deployments recientes ==="
        curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/buildit-qa/deployments?per_page=2" \
          -H "Authorization: Bearer $CF_TOKEN" \
          | python3 -c "import json,sys; d=json.load(sys.stdin); [print(dep['id'], dep.get('latest_stage',{}).get('status'), dep.get('env'), dep.get('created_on')) for dep in d['result']]" || echo "API fallo"
        echo "=== API: archivos del ultimo deployment ==="
        DEP=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/buildit-qa/deployments?per_page=1" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
        curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/buildit-qa/deployments/$DEP/history/files" \
          -H "Authorization: Bearer $CF_TOKEN" -o /tmp/files.json -w "API files: %{http_code}\n"
        python3 -c "import json; d=json.load(open('/tmp/files.json')); r=d['result']; files=r.get('files'); print('environment:', r.get('environment'), '| url:', r.get('url')); print('tipo de files:', type(files)); print('total files:', len(files) if hasattr(files,'__len__') else 'n/a'); print('muestra:', json.dumps(files)[:600] if not isinstance(files, list) else json.dumps(files[:15])[:600])"
      shell: bash

    # Crea el proyecto si no existe (falla si ya existe: se ignora)
    - name: Asegurar proyecto Cloudflare Pages (Prod)
      if: ${{ inputs.environment == 'Prod' }}
      uses: cloudflare/wrangler-action@v3
      continue-on-error: true
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages project create buildit-prod --production-branch=main

    - name: Deploy to Cloudflare Pages (Prod)
      if: ${{ inputs.environment == 'Prod' }}
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        wranglerVersion: "4"
        command: pages deploy dist/wwwroot --project-name buildit-prod
